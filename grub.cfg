# Load the video drivers built into GRUB
insmod all_video

# Set the graphical terminal (optional, for GRUB's own menu)


# THE IMPORTANT PART:
# 'keep' means use the same resolution as the GRUB menu
# Or you can specify one: set gfxpayload=1024x768x32
set gfxpayload=keep

menuentry "My Custom OS" {
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.img "initrd"
    boot
}